[project]
name = "booru-tagger"
description = "ComfyUI nodes that tag images with booru tags for use in prompts. Bundles the commonly used tagger models — WD, Pixai, Camie, CL Tagger and AnimeTimm — keeps a model loaded for reuse across images, and outputs general, rating and character tag groups."
version = "1.0.2"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "pandas",
    # One automatic choice per platform, no user decision needed:
    #   - Windows/Linux: CUDA-capable build (falls back to CPU at runtime)
    #   - macOS: CPU build (onnxruntime-gpu ships no macOS wheels)
    "onnxruntime-gpu; sys_platform != 'darwin'",
    "onnxruntime; sys_platform == 'darwin'",
]

[project.urls]
Repository = "https://github.com/nestflow/ComfyUI-Booru-Tagger"

[tool.comfy]
PublisherId = "nestflow"
DisplayName = "ComfyUI-Booru-Tagger"
