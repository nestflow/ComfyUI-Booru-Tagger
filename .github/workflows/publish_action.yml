name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release notes for this version
        id: notes
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -f "release_notes/$version.md" ]; then
            echo "file=release_notes/$version.md" >> "$GITHUB_OUTPUT"
            echo "Using release_notes/$version.md as the changelog."
          else
            echo "No release_notes/$version.md found; publishing without a changelog."
          fi

      - name: Install comfy-cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install comfy-cli

      - name: Prepare ComfyUI environment
        run: comfy --skip-prompt --no-enable-telemetry env

      - name: Publish Custom Node
        env:
          ## Add your own personal access token to your GitHub repository secrets.
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          if [ -n "$NOTES_FILE" ]; then
            comfy --skip-prompt --no-enable-telemetry node publish \
              --token "$REGISTRY_ACCESS_TOKEN" --changelog-file "$NOTES_FILE"
          else
            comfy --skip-prompt --no-enable-telemetry node publish \
              --token "$REGISTRY_ACCESS_TOKEN"
          fi
